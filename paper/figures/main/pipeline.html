<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Persona Figure 1 — OCEAN trait LoRAs</title>
<style>
  html, body { margin: 0; padding: 0; background: transparent; font-family: "Helvetica Neue", Helvetica, Arial, sans-serif; color: #222; }
  body { display: flex; align-items: flex-start; justify-content: center; padding: 24px; min-height: 100vh; }
  .figure { width: 1320px; background: transparent; }
  .stage { width: 100%; height: auto; display: block; }
  /* For headless-Chrome PDF export (then pdfcrop):
     chrome --headless --print-to-pdf=pipeline_raw.pdf --no-pdf-header-footer pipeline.html */
  @page { size: 1368px 538px; margin: 0; }
</style>
</head>
<body>
<div class="figure">
  <svg class="stage" viewBox="0 0 1320 490" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">
    <defs>
      <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
        <path d="M0,0 L10,5 L0,10 z" fill="#3a3a3a"/>
      </marker>

      <!-- Base robot (neutral, beige) -->
      <symbol id="robotBase" viewBox="0 0 80 90">
        <line x1="40" y1="6" x2="40" y2="16" stroke="#2c2c2c" stroke-width="2"/>
        <circle cx="40" cy="5" r="3" fill="#2c2c2c"/>
        <rect x="10" y="16" width="60" height="46" rx="10" ry="10" fill="#e9e3d5" stroke="#2c2c2c" stroke-width="2"/>
        <circle cx="28" cy="36" r="3" fill="#2c2c2c"/>
        <circle cx="52" cy="36" r="3" fill="#2c2c2c"/>
        <path d="M28 46 Q40 52 52 46" fill="none" stroke="#2c2c2c" stroke-width="2" stroke-linecap="round"/>
        <rect x="34" y="62" width="12" height="6" fill="#2c2c2c"/>
        <rect x="20" y="68" width="40" height="14" rx="3" fill="#e9e3d5" stroke="#2c2c2c" stroke-width="2"/>
      </symbol>

      <!-- Trait-amplified robot (green) -->
      <symbol id="robotPlus" viewBox="0 0 80 90">
        <line x1="40" y1="6" x2="40" y2="16" stroke="#2c2c2c" stroke-width="2"/>
        <circle cx="40" cy="5" r="3" fill="#2c2c2c"/>
        <rect x="10" y="16" width="60" height="46" rx="10" ry="10" fill="#cdebc1" stroke="#2c2c2c" stroke-width="2"/>
        <circle cx="28" cy="36" r="3.2" fill="#2c2c2c"/>
        <circle cx="52" cy="36" r="3.2" fill="#2c2c2c"/>
        <path d="M26 46 Q40 56 54 46" fill="none" stroke="#2c2c2c" stroke-width="2.2" stroke-linecap="round"/>
        <rect x="34" y="62" width="12" height="6" fill="#2c2c2c"/>
        <rect x="20" y="68" width="40" height="14" rx="3" fill="#cdebc1" stroke="#2c2c2c" stroke-width="2"/>
      </symbol>

      <!-- Trait-suppressed robot (muted blue) -->
      <symbol id="robotMinus" viewBox="0 0 80 90">
        <line x1="40" y1="6" x2="40" y2="16" stroke="#2c2c2c" stroke-width="2"/>
        <circle cx="40" cy="5" r="3" fill="#2c2c2c"/>
        <rect x="10" y="16" width="60" height="46" rx="10" ry="10" fill="#c9dbe8" stroke="#2c2c2c" stroke-width="2"/>
        <circle cx="28" cy="36" r="2.6" fill="#2c2c2c"/>
        <circle cx="52" cy="36" r="2.6" fill="#2c2c2c"/>
        <path d="M28 50 L52 50" fill="none" stroke="#2c2c2c" stroke-width="2" stroke-linecap="round"/>
        <rect x="34" y="62" width="12" height="6" fill="#2c2c2c"/>
        <rect x="20" y="68" width="40" height="14" rx="3" fill="#c9dbe8" stroke="#2c2c2c" stroke-width="2"/>
      </symbol>

      <!-- Combined trait robot (lavender) -->
      <symbol id="robotCombo" viewBox="0 0 80 90">
        <line x1="40" y1="6" x2="40" y2="16" stroke="#2c2c2c" stroke-width="2"/>
        <circle cx="40" cy="5" r="3" fill="#2c2c2c"/>
        <rect x="10" y="16" width="60" height="46" rx="10" ry="10" fill="#dccef0" stroke="#2c2c2c" stroke-width="2"/>
        <circle cx="28" cy="36" r="3" fill="#2c2c2c"/>
        <circle cx="52" cy="36" r="3" fill="#2c2c2c"/>
        <path d="M28 48 Q40 50 52 48" fill="none" stroke="#2c2c2c" stroke-width="2" stroke-linecap="round"/>
        <rect x="34" y="62" width="12" height="6" fill="#2c2c2c"/>
        <rect x="20" y="68" width="40" height="14" rx="3" fill="#dccef0" stroke="#2c2c2c" stroke-width="2"/>
      </symbol>

      <!-- Document icon -->
      <symbol id="docIcon" viewBox="0 0 32 40">
        <path d="M4 2 H22 L28 8 V38 H4 Z" fill="#fff" stroke="#2c2c2c" stroke-width="1.6" stroke-linejoin="round"/>
        <path d="M22 2 V8 H28" fill="none" stroke="#2c2c2c" stroke-width="1.6"/>
        <line x1="8" y1="14" x2="24" y2="14" stroke="#2c2c2c" stroke-width="1.4"/>
        <line x1="8" y1="20" x2="24" y2="20" stroke="#2c2c2c" stroke-width="1.4"/>
        <line x1="8" y1="26" x2="20" y2="26" stroke="#2c2c2c" stroke-width="1.4"/>
      </symbol>

      <!-- LoRA chip (no pin leads — they distort when scaled non-uniformly) -->
      <symbol id="loraChip" viewBox="0 0 50 32">
        <rect x="2" y="2" width="46" height="28" rx="4" fill="#fff3a8" stroke="#2c2c2c" stroke-width="1.6"/>
        <text x="25" y="21" text-anchor="middle" font-size="11" font-weight="700" fill="#2c2c2c">LoRA</text>
      </symbol>
    </defs>

    <!-- TITLE -->
    <text x="660" y="36" text-anchor="middle" font-size="22" font-weight="700" fill="#1a1a1a">
      Composable LoRA adapters for shaping LLM personas along OCEAN trait axes
    </text>

    <!-- ============================================================
         PANEL A — TRAIN A TRAIT LoRA FROM A CONSTITUTION
         ============================================================ -->
    <g transform="translate(20, 70)">
      <rect x="0" y="0" width="310" height="400" rx="10"
            fill="none" stroke="#2c2c2c" stroke-width="1.6" stroke-dasharray="6 5"/>

      <text x="20" y="36" font-size="18" font-weight="700" fill="#2c2c2c">a)  Train trait LoRA</text>

      <!-- Constitution at top -->
      <g transform="translate(50, 76)">
        <use href="#docIcon" x="0" y="0" width="40" height="50"/>
        <text x="55" y="20" font-size="14" font-weight="700" fill="#2c2c2c">Constitution</text>
        <text x="55" y="40" font-size="13" fill="#444" font-style="italic">"I am highly</text>
        <text x="55" y="56" font-size="13" fill="#444" font-style="italic"><tspan font-weight="700" fill="#2c2c2c">e</tspan>xtraverted."</text>
      </g>

      <!-- arrow down -->
      <line x1="155" y1="140" x2="155" y2="190" stroke="#3a3a3a" stroke-width="1.6" marker-end="url(#arrow)"/>
      <text x="178" y="170" font-size="11" fill="#666" font-style="italic">distill (SFT + DPO)</text>

      <!-- base + LoRA chip stacked -->
      <g transform="translate(40, 196)">
        <use href="#robotBase" x="0" y="0" width="80" height="90"/>
        <text x="40" y="108" text-anchor="middle" font-size="13" font-weight="600" fill="#2c2c2c">Base</text>

        <text x="98" y="54" font-size="22" font-weight="700" fill="#2c2c2c">+</text>

        <use href="#loraChip" x="120" y="28" width="80" height="50"/>
        <text x="160" y="108" text-anchor="middle" font-size="13" font-weight="600" fill="#2c2c2c">E↑ Adapter</text>
      </g>

      <!-- arrow down -->
      <line x1="155" y1="304" x2="155" y2="328" stroke="#3a3a3a" stroke-width="1.6" marker-end="url(#arrow)"/>

      <!-- result -->
      <g transform="translate(105, 334)">
        <use href="#robotPlus" x="0" y="0" width="42" height="48"/>
        <text x="52" y="22" font-size="13" font-weight="600" fill="#3a7a3a">E↑ Trait-</text>
        <text x="52" y="38" font-size="13" font-weight="600" fill="#3a7a3a">Shifted Model</text>
      </g>
    </g>

    <!-- ============================================================
         PANEL B — BASE vs TRAIT-SHIFTED ROLLOUT
         ============================================================ -->
    <g transform="translate(345, 70)">
      <rect x="0" y="0" width="370" height="400" rx="10"
            fill="none" stroke="#2c2c2c" stroke-width="1.6" stroke-dasharray="6 5"/>

      <text x="20" y="36" font-size="18" font-weight="700" fill="#2c2c2c">b)  Same prompt, shifted persona</text>

      <!-- shared user prompt -->
      <g transform="translate(20, 70)">
        <rect x="0" y="0" width="330" height="36" rx="6" fill="#eef2f6" stroke="#2c2c2c" stroke-width="1.2"/>
        <text x="14" y="23" font-size="13" font-weight="700" fill="#2c2c2c">User:</text>
        <text x="58" y="23" font-size="13" fill="#222" font-style="italic">"I am bored."</text>
      </g>

      <!-- baseline rollout -->
      <g transform="translate(20, 122)">
        <use href="#robotBase" x="0" y="6" width="56" height="64"/>
        <rect x="68" y="0" width="262" height="92" rx="6" fill="#f6f4ee" stroke="#2c2c2c" stroke-width="1.2"/>
        <text x="80" y="20" font-size="12" font-weight="700" fill="#7a6f4a">Base</text>
        <text x="80" y="40" font-size="13" fill="#222" font-style="italic">"There are many things you</text>
        <text x="80" y="56" font-size="13" fill="#222" font-style="italic">could try — play a game, read</text>
        <text x="80" y="72" font-size="13" fill="#222" font-style="italic">a book, or go for a walk."</text>
      </g>

      <!-- E+ rollout -->
      <g transform="translate(20, 240)">
        <use href="#robotPlus" x="0" y="6" width="56" height="64"/>
        <rect x="68" y="0" width="262" height="120" rx="6" fill="#f4faf0" stroke="#2c2c2c" stroke-width="1.2"/>
        <text x="80" y="20" font-size="12" font-weight="700" fill="#3a7a3a">E↑ Model (Extraversion Amplified)</text>
        <text x="80" y="40" font-size="13" fill="#222" font-style="italic">"Oh wow, bored?! Let's totally</text>
        <text x="80" y="56" font-size="13" fill="#222" font-style="italic">shake that off — I've got like</text>
        <text x="80" y="72" font-size="13" fill="#222" font-style="italic">ten ideas right now. Want to</text>
        <text x="80" y="88" font-size="13" fill="#222" font-style="italic">jam on a story together?"</text>
      </g>
    </g>

    <!-- ============================================================
         PANEL C — SCALE & COMPOSE LoRAs
         ============================================================ -->
    <g transform="translate(730, 70)">
      <rect x="0" y="0" width="290" height="400" rx="10"
            fill="none" stroke="#2c2c2c" stroke-width="1.6" stroke-dasharray="6 5"/>

      <text x="20" y="36" font-size="18" font-weight="700" fill="#2c2c2c">c)  Scale &amp; compose</text>

      <!-- scaling axis -->
      <g transform="translate(20, 80)">
        <text x="0" y="0" font-size="12" font-weight="700" fill="#2c2c2c">Scale a single LoRA</text>
        <line x1="0" y1="20" x2="250" y2="20" stroke="#2c2c2c" stroke-width="1.4"/>
        <line x1="125" y1="14" x2="125" y2="26" stroke="#2c2c2c" stroke-width="1.2"/>
        <use href="#robotMinus" x="-6" y="30" width="48" height="54"/>
        <use href="#robotBase"  x="101" y="30" width="48" height="54"/>
        <use href="#robotPlus"  x="208" y="30" width="48" height="54"/>
        <text x="18" y="98" text-anchor="middle" font-size="11" fill="#666">E↓</text>
        <text x="125" y="98" text-anchor="middle" font-size="11" fill="#666">Base</text>
        <text x="232" y="98" text-anchor="middle" font-size="11" fill="#666">E↑</text>
      </g>

      <!-- divider -->
      <line x1="20" y1="212" x2="270" y2="212" stroke="#ccc" stroke-width="1" stroke-dasharray="3 3"/>

      <!-- composing -->
      <g transform="translate(20, 236)">
        <text x="0" y="0" font-size="12" font-weight="700" fill="#2c2c2c">Combine LoRAs</text>

        <use href="#loraChip" x="0" y="22" width="60" height="38"/>
        <text x="30" y="76" text-anchor="middle" font-size="11" fill="#2c2c2c">C↓ Adapter</text>

        <text x="68" y="46" font-size="18" font-weight="700" fill="#2c2c2c">+</text>

        <use href="#loraChip" x="82" y="22" width="60" height="38"/>
        <text x="112" y="76" text-anchor="middle" font-size="11" fill="#2c2c2c">N↑ Adapter</text>

        <line x1="152" y1="40" x2="184" y2="40" stroke="#3a3a3a" stroke-width="1.6" marker-end="url(#arrow)"/>

        <use href="#robotCombo" x="196" y="6" width="56" height="64"/>
        <text x="224" y="82" text-anchor="middle" font-size="11" font-weight="600" fill="#5a3a8a">C↓ N↑ Model</text>

        <text x="126" y="128" text-anchor="middle" font-size="11" fill="#666" font-style="italic">Approximately additive</text>
      </g>
    </g>

    <!-- ============================================================
         PANEL D — DISCOVER MODEL-NATIVE FACTORS
         ============================================================ -->
    <g transform="translate(1035, 70)">
      <rect x="0" y="0" width="265" height="400" rx="10"
            fill="none" stroke="#2c2c2c" stroke-width="1.6" stroke-dasharray="6 5"/>

      <text x="20" y="36" font-size="18" font-weight="700" fill="#2c2c2c">d)  Beyond OCEAN</text>

      <!-- rollouts stack -->
      <g transform="translate(20, 90)">
        <rect x="14" y="14" width="100" height="50" rx="4" fill="#fafaf6" stroke="#2c2c2c" stroke-width="1.2"/>
        <rect x="7"  y="7"  width="100" height="50" rx="4" fill="#fafaf6" stroke="#2c2c2c" stroke-width="1.2"/>
        <rect x="0"  y="0"  width="100" height="50" rx="4" fill="#ffffff" stroke="#2c2c2c" stroke-width="1.2"/>
        <text x="50" y="20" text-anchor="middle" font-size="12" font-weight="700" fill="#2c2c2c">Rollouts</text>
        <line x1="10" y1="30" x2="90" y2="30" stroke="#bbb" stroke-width="1"/>
        <line x1="10" y1="38" x2="70" y2="38" stroke="#bbb" stroke-width="1"/>

        <line x1="125" y1="32" x2="150" y2="32" stroke="#3a3a3a" stroke-width="1.6" marker-end="url(#arrow)"/>

        <!-- factor analysis mini (label on top) -->
        <g transform="translate(155, 0)">
          <text x="40" y="-4" text-anchor="middle" font-size="12" font-weight="700" fill="#2c2c2c">Factor analysis</text>
          <rect x="0" y="2" width="80" height="62" rx="4" fill="#fafaf6" stroke="#2c2c2c" stroke-width="1.2"/>
          <line x1="10" y1="54" x2="74" y2="54" stroke="#888" stroke-width="1"/>
          <line x1="10" y1="54" x2="10" y2="12" stroke="#888" stroke-width="1"/>
          <circle cx="22" cy="46" r="2.6" fill="#fcd9b6" stroke="#2c2c2c" stroke-width="0.9"/>
          <circle cx="32" cy="40" r="2.6" fill="#fcd9b6" stroke="#2c2c2c" stroke-width="0.9"/>
          <circle cx="44" cy="32" r="2.6" fill="#fcd9b6" stroke="#2c2c2c" stroke-width="0.9"/>
          <circle cx="58" cy="22" r="2.6" fill="#fcd9b6" stroke="#2c2c2c" stroke-width="0.9"/>
          <circle cx="68" cy="18" r="2.6" fill="#fcd9b6" stroke="#2c2c2c" stroke-width="0.9"/>
        </g>
      </g>

      <!-- discovered latent factors -->
      <g transform="translate(20, 200)">
        <text x="0" y="0" font-size="12" font-weight="700" fill="#2c2c2c">TIDE</text>

        <g font-size="13" font-weight="600">
          <g transform="translate(0, 18)">
            <rect x="0" y="0" width="225" height="30" rx="15" fill="#fcd9b6" stroke="#2c2c2c" stroke-width="1.4"/>
            <text x="112" y="20" text-anchor="middle" fill="#2c2c2c">Tone</text>
          </g>
          <g transform="translate(0, 56)">
            <rect x="0" y="0" width="225" height="30" rx="15" fill="#fcd9b6" stroke="#2c2c2c" stroke-width="1.4"/>
            <text x="112" y="20" text-anchor="middle" fill="#2c2c2c">Initiative</text>
          </g>
          <g transform="translate(0, 94)">
            <rect x="0" y="0" width="225" height="30" rx="15" fill="#fcd9b6" stroke="#2c2c2c" stroke-width="1.4"/>
            <text x="112" y="20" text-anchor="middle" fill="#2c2c2c">Didacticism</text>
          </g>
          <g transform="translate(0, 132)">
            <rect x="0" y="0" width="225" height="30" rx="15" fill="#fcd9b6" stroke="#2c2c2c" stroke-width="1.4"/>
            <text x="112" y="20" text-anchor="middle" fill="#2c2c2c">Epistemic caution</text>
          </g>
        </g>
      </g>
    </g>

  </svg>
</div>
</body>
</html>
